name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:

jobs:
  ci-validation:
    name: CI Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: pnpm and Node setup
        uses: pnpm/setup@v3.1.2
        with:
          install: false

      - name: Install dependencies
        run: |
          pnpm i

      - name: Run CI checks
        # Note that we must use the run verb, as pnpm ci is reserved.
        run: |
          pnpm run ci
